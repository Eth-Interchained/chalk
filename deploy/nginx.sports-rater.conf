# sports-rater.com — nginx server block for Cloudflare FLEXIBLE (edge terminates
# TLS, edge -> origin is plain HTTP on :80). Origin Cert + Full (Strict) is the
# queued hardening; when that lands, add a `listen 443 ssl` block with the
# origin cert and leave everything below unchanged.
#
# Drop in /etc/nginx/sites-available/sports-rater.conf, symlink into
# sites-enabled (or /etc/nginx/conf.d/), then `nginx -t && systemctl reload nginx`.
# CHALK listens on 127.0.0.1:4040 (deploy/chalk.service); NEDB is embedded in
# that process — nothing else listens.

# Cloudflare edge ranges (https://www.cloudflare.com/ips-v4, /ips-v6). With these,
# $remote_addr becomes the real visitor IP taken from CF-Connecting-IP.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Behind Flexible, $scheme is always "http" at the origin. Cloudflare tells us the
# visitor's real scheme in X-Forwarded-Proto; trust it, default to http.
map $http_x_forwarded_proto $visitor_proto { default $scheme; "https" https; "http" http; }

# WebSocket-safe Connection header (CHALK has no websockets today; this keeps
# keep-alive to the upstream instead of forcing "upgrade" on every request).
map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

server {
  listen 80;
  listen [::]:80;
  server_name sports-rater.com www.sports-rater.com;

  access_log /var/log/nginx/sports-rater.access.log;
  error_log  /var/log/nginx/sports-rater.error.log;

  # Fan writes are tiny (280-char takes); nothing bigger belongs here.
  client_max_body_size 64k;

  # CHALK's per-address rate limiter reads the FIRST X-Forwarded-For entry.
  # Cloudflare APPENDS the visitor IP to any client-supplied X-Forwarded-For, so
  # forwarding the inbound header verbatim would let a client spoof the first
  # entry and dodge the limiter. Overwrite it with the real-ip'd $remote_addr.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto $visitor_proto;
  proxy_set_header CF-Ray            $http_cf_ray;
  proxy_http_version 1.1;

  # /api/v1/ask streams Server-Sent Events: no buffering anywhere, long read
  # timeout (a slow model answer can take a minute), keep-alive to upstream.
  location = /api/v1/ask {
    proxy_pass http://127.0.0.1:4040;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header X-Accel-Buffering no;
    add_header Cache-Control no-cache;
  }

  # Everything else: JSON API + static client.
  location / {
    proxy_pass http://127.0.0.1:4040;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;
  }
}
