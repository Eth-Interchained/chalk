# sports-rater.com — nginx server block (Cloudflare Flexible today, like the
# rest of Mark's VPS; Origin Cert + Full (Strict) is queued alongside the NEDB
# portal hardening). Drop in /etc/nginx/conf.d/ (or Mail-in-a-Box's custom hook),
# `nginx -t && systemctl reload nginx`.
#
# CHALK listens on 127.0.0.1:4040 (deploy/chalk.service). nedbd stays loopback
# only — never exposed.

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
  listen 80;
  listen [::]:80;
  server_name sports-rater.com www.sports-rater.com;

  # Cloudflare sets the real client IP here; CHALK's per-address rate limiter reads X-Forwarded-For.
  set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;    set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;  set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;    set_real_ip_from 131.0.72.0/22;
  real_ip_header CF-Connecting-IP;

  client_max_body_size 64k;          # fan writes are tiny; nothing bigger belongs here
  access_log /var/log/nginx/sports-rater.access.log;
  error_log  /var/log/nginx/sports-rater.error.log;

  # SSE ask loop: no buffering, long read timeout (a slow model answer may take a minute).
  location /api/v1/ask {
    proxy_pass http://127.0.0.1:4040;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    add_header X-Accel-Buffering no;
  }

  location / {
    proxy_pass http://127.0.0.1:4040;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
