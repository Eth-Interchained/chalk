<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07090d" />
<title>Sports-Rater · CHALK</title>
<meta name="description" content="Live Football Intelligence. The database knows. Deterministic code calculates. The model interprets. Provenance proves." />
<meta name="copyright" content="Copyright (c) 2026 Interchained LLC. All rights reserved. SPDX-License-Identifier: BUSL-1.1" />
<meta name="author" content="Interchained LLC" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="/chalk.svg" type="image/svg+xml" />
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header class="top">
  <a class="brand" href="/">
    <span class="mark">SPORTS<b>RATER</b></span><span class="sub">powered by CHALK</span>
  </a>
  <nav class="views" aria-label="Views">
    <button class="view-tab on" data-view="home">Dashboard</button>
    <button class="view-tab" data-view="feed">Feed <span class="view-count" id="feed-count"></span></button>
  </nav>
  <div class="ctx">
    <button id="who" class="pill who" title="Your Sports-Rater handle — no account, just math">rate as…</button>
    <select id="team" class="pill" aria-label="Team"></select>
    <select id="season" class="pill" aria-label="Season"></select>
    <button id="mode" class="pill mode" aria-pressed="false" title="Toggle coach view">Fan</button>
  </div>
</header>

<main id="main" class="view-home">
  <!-- TEAM HERO: full-bleed generated field atmosphere in the team's palette; the dashboard rises over its lower half -->
  <section class="team-hero" id="team-hero" aria-hidden="true">
    <div class="team-hero-frame">
      <div class="team-hero-img" id="team-hero-a"></div>
      <div class="team-hero-img" id="team-hero-b"></div>
      <div class="team-hero-vignette"></div>
    </div>
  </section>
  <!-- HOME -->
  <section id="home" class="home">
    <div class="hero" id="hero">
      <div class="hero-team">
        <div class="hero-logo-slot" id="h-logo"></div>
        <div class="hero-abbr" id="h-abbr">—</div>
        <div class="hero-name" id="h-name"></div>
        <div class="hero-badges" id="h-badges"></div>
      </div>
      <div class="hero-rating" id="rating-card">
        <div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="52"/><circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="52"/></svg><div class="ring-num" id="rc-score">–</div></div>
        <div class="hero-rating-meta">
          <div class="rc-label">Third Down Rating</div>
          <div class="rc-rank" id="rc-rank"></div>
          <div class="rc-def" id="rc-line1"></div>
          <div class="rc-actions">
            <button class="chip" data-ask="How does Tampa's third-down rating break down?">Why?</button>
            <button class="chip" id="rate-differently">Rate differently</button>
            <button class="chip" id="show-league">League</button>
          </div>
        </div>
      </div>
    </div>

    <section class="ratings" id="ratings" aria-label="Rating card"></section>
    <section class="record" id="record" aria-label="The Record">
      <div class="tile-h">The Record <span class="muted" id="record-sub">what CHALK has said about this team</span></div>
      <div class="record-strip" id="record-strip"></div>
    </section>

    <div class="grid">
      <section class="tile scout" id="tile-scout">
        <div class="tile-h">This week <span class="muted" id="scout-sub"></span></div>
        <div id="scout-body"></div>
      </section>
      <section class="tile trend" id="tile-trend">
        <div class="tile-h">Rating trend <span class="muted" id="trend-sub"></span></div>
        <div class="suggest" id="trend-chips" style="padding:0 0 8px"></div>
        <svg id="trend-svg" viewBox="0 0 320 96" preserveAspectRatio="none"></svg>
        <div class="tile-f" id="trend-headline"></div>
      </section>
      <section class="tile form" id="tile-form">
        <div class="tile-h">Recent form</div>
        <div class="form-body" id="form-body"></div>
      </section>
      <section class="tile last" id="tile-last">
        <div class="tile-h">Last game</div>
        <div id="last-body"></div>
      </section>
      <section class="tile next" id="tile-next">
        <div class="tile-h">Next up</div>
        <div id="next-body"></div>
      </section>
      <section class="tile weak" id="tile-weak">
        <div class="tile-h">What's hurting them</div>
        <div id="weak-body"></div>
      </section>
      <section class="tile comps" id="tile-comps">
        <div class="tile-h">Rating components</div>
        <div class="rc-components" id="rc-components"></div>
      </section>
      <section class="tile games" id="tile-games">
        <div class="tile-h">Games <span class="muted" id="games-sub"></span></div>
        <div id="games-body" class="games-body"></div>
      </section>
      <section class="tile fanfeed" id="tile-feed">
        <div class="tile-h">Fans <span class="muted" id="feed-sub"></span></div>
        <form id="take" class="take" autocomplete="off"><input id="take-text" maxlength="280" placeholder="Your take (no links, 280 max)…" /><button type="submit" class="chip">Post</button></form>
        <div id="feed-body" class="feed-body"></div>
      </section>
    </div>
  </section>

  <!-- FEED: every completion, newest first, live asks land on top -->
  <section id="feedview" class="feedview">
    <div class="feed-head">
      <div class="tile-h">Live feed <span class="muted" id="feed-sub">every answer CHALK has given about this team, newest first</span></div>
      <button class="chip" id="feed-refresh" title="Pull the newest answers now">↻ refresh</button>
    </div>
    <section class="suggest" id="suggest"></section>
    <section id="feed" class="feed"></section>
  </section>
  <footer class="site-foot" id="site-foot"></footer>
</main>

<form id="ask" class="ask" autocomplete="off">
  <input id="q" name="q" type="text" placeholder="Ask about any game, play, or situation…" enterkeyhint="send" />
  <button type="submit" aria-label="Ask">→</button>
</form>

<template id="tpl-answer">
  <article class="card answer">
    <header class="card-head">
      <div class="q"></div>
      <div class="badges"></div>
    </header>
    <div class="statements"></div>
    <div class="prose"></div>
    <div class="coach"></div>
    <footer class="card-foot">
      <button class="chip act-react" data-kind="agree">👍 Agree</button>
      <button class="chip act-react" data-kind="disagree">👎 Disagree</button>
      <button class="chip act-evidence">Show evidence</button>
      <button class="chip act-coach">Coach view</button>
      <button class="chip act-provenance">Provenance</button>
      <button class="chip act-plan">Plan</button>
    </footer>
    <div class="drawer"></div>
  </article>
</template>

<script src="/app.js" type="module"></script>
</body>
</html>
